name: Build Repo Listing

on:
  workflow_dispatch:
  repository_dispatch:
    # vpm-package-release: 全パッケージリポジトリ共通の汎用イベント種別。
    #   新しいパッケージを source.json に足してもここは編集不要。
    # daerd-release / yozolab-utils-release: 旧・リポジトリ固有の種別（後方互換）。
    #   各リポジトリが vpm-package-release に移行し終えたら削除してよい。
    types: [vpm-package-release, daerd-release, yozolab-utils-release]
  push:
    branches: main
    paths: source.json

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:
  
  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v4 # check out this repo
      - uses: actions/checkout@v4 # check out automation repo
        with:
          repository: vrchat-community/package-list-action
          path: ${{env.pathToCi}}
          clean: false # otherwise the local repo will no longer be checked out

      # package-list-action の build.sh は `dotnet --list-sdks | grep ^8` で 8系SDKの有無を見て
      # net8.0/net6.0 を選ぶ。ランナーが .NET 10 SDK 同梱に更新され 8系SDKが無くなったため
      # net6.0 にフォールバックし、6.0 ランタイム未導入で起動失敗していた。8.0 SDK を明示導入して net8.0 を選ばせる。
      # 一覧を作る PackageBuilder（ci/PackageBuilder）は net6.0 向けで、ビルドしたあと .NET 6 の実行環境で起動する。
      # ランナーから .NET 6 が外れて起動に失敗した（2026-10-06）ので、6.0 も入れる。
      - name: Setup .NET 8 SDK and .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
          
      - name: Build Package Version Listing
        run: ${{env.pathToCi}}/build.cmd BuildMultiPackageListing --root ${{env.pathToCi}} --list-publish-directory $GITHUB_WORKSPACE/${{env.listPublishDirectory}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{env.listPublishDirectory}}
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4